name: 🐍 Neon Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ahimbisibwe-sadam
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%232BFF88&color_dots=%23081020,%230A3D26,%230F7A4A,%2312B96B,%232BFF88
            dist/github-contribution-grid-snake.svg?color_snake=%2300B3FF

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
