name: 🐍 Neon Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ahimbisibwe-sadam
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%231DE9FF&color_dots=%230B1020,%23123A4D,%230E6B8A,%2312A3C9,%231DE9FF
            dist/github-contribution-grid-snake.svg?color_snake=%23FF2ECC

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
