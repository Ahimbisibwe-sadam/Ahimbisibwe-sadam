<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" fill="none" role="img" aria-label="neon heartbeat divider">
  <defs>
    <linearGradient id="beatFade" x1="60" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1DE9FF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#1DE9FF" stop-opacity="0.95"/>
      <stop offset="0.82" stop-color="#FF2ECC" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF2ECC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dotFade" x1="0" y1="0" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1DE9FF"/>
      <stop offset="1" stop-color="#1DE9FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="beatBlur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <path id="beatPath" d="M 60 78 H 430 l 30 -42 32 72 30 -56 30 26 H 1140" stroke="url(#beatFade)" stroke-width="2.5" stroke-linejoin="round" fill="none"/>

  <path d="M 60 78 H 430 l 30 -42 32 72 30 -56 30 26 H 1140" stroke="url(#beatFade)" stroke-width="2.5" stroke-linejoin="round" fill="none" filter="url(#beatBlur)" opacity="0.55">
    <animate attributeName="opacity" values="0.25;0.65;0.25" dur="5s" repeatCount="indefinite"/>
  </path>

  <path d="M 60 78 H 430 l 30 -42 32 72 30 -56 30 26 H 1140" stroke="#7AF7FF" stroke-width="1" stroke-linejoin="round" fill="none" opacity="0.28" stroke-dasharray="4 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="4s" repeatCount="indefinite"/>
  </path>

  <circle r="4.5" fill="url(#dotFade)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#beatPath"/>
    </animateMotion>
  </circle>
  <circle r="10" fill="#1DE9FF" opacity="0.18">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#beatPath"/>
    </animateMotion>
  </circle>
</svg>
